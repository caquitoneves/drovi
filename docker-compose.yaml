version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: drovi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: drovi
      POSTGRES_PASSWORD: drovi123
      POSTGRES_DB: drovi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
