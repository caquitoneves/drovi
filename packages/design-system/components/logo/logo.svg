<svg
        width="96"
        height="96"
        viewBox="0 0 96 96"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
>
    <clipPath id="drovi-logo-clip">
        <rect width="96" height="96" />
    </clipPath>
    <g clip-path="url(#drovi-logo-clip)" fill="#222222">
        <!-- Círculo central (maior e mais espesso visualmente) -->
